name: SonarCloud Code Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Test, build, and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Install Directus extension dependencies
        working-directory: extensions/directus-extension-signed-files
        run: npm ci

      - name: Build Directus extension
        working-directory: extensions/directus-extension-signed-files
        run: npm run build

      - name: Validate Directus extension
        working-directory: extensions/directus-extension-signed-files
        run: npm run validate

      - name: Read package version
        id: package
        run: node -e "const fs = require('node:fs'); const { version } = require('./package.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n')"

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.projectVersion=${{ steps.package.outputs.version }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
